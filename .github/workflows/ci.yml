name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check publish inputs
        run: node scripts/check-publish.mjs
      - name: Run tests
        run: node --test test/*.test.mjs
      - name: Build release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-Release.ps1
